name: Java App CI


on: # on which events the workflow will run/pipeline will be triggered
 workflow_dispatch:
 # push:
 #   branches: [ "main" ]
 # pull_request:
 #   branches: [ "main" ]
jobs:
 build: # this is the name of the job, you can name it anything
   runs-on: ubuntu-latest
   steps:
     # - name: clone the git repository
     #   # run: |
     #   #   apt update
     #   #   apt install git -y
     #   #   git clone https://github.com/nareshwart/java-app.git
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build with Maven
      run: mvn clean install
